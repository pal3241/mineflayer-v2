name: Release MineHive Client

on:
  push:
    paths:
      - '.github/workflows/release-v1.yml'
      - 'client-mod/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build release JAR
        working-directory: client-mod
        run: gradle clean build --stacktrace
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^mod_version=//p' client-mod/gradle.properties)"
          tag="v${version}"
          asset="client-mod/build/libs/minehive-client-${version}.jar"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset#MineHive Fabric Client ${version}" --clobber
          else
            gh release create "$tag" "$asset#MineHive Fabric Client ${version}" \
              --target "$GITHUB_SHA" \
              --title "MineHive ${version}" \
              --notes "Build Fabric terbaru untuk Minecraft 1.21.1. Memperbaiki blur RTS/blueprint dan menyertakan neural environment serta local command brain." \
              --latest
          fi
